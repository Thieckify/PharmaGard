# Profil prod : silencieux et strict

# Hibernate vérifie que les tables correspondent au code, sans rien modifier. Au tout premier
# déploiement sur une base vide, lancer une seule fois avec la variable DDL_AUTO=update
# pour créer les tables, puis retirer cette variable.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Pas d'affichage des requêtes SQL
spring.jpa.show-sql=false

# Seules les données de référence (zones, quartiers) sont chargées. Jamais data-dev.sql : ses
# comptes de test ont un mot de passe connu de tous.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-reference.sql

# Seul le contrôle de santé de l'application est exposé par Actuator
management.endpoints.web.exposure.include=health

# La documentation de l'API n'est pas exposée en production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false