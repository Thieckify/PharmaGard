# Profil dev : confort du développeur

# Hibernate crée et met à jour les tables tout seul
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL dans la console, mises en forme
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Exécute data.sql à chaque démarrage (zones, quartiers, comptes de test, démonstration)
spring.sql.init.mode=always