# Profil dev : confort du développeur

# Hibernate crée et met à jour les tables tout seul
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL dans la console, mises en forme
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Scripts SQL exécutés à chaque démarrage, dans cet ordre : d'abord les données de référence
# (zones, quartiers), puis les données de développement (comptes de test, démonstration)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-reference.sql,classpath:data-dev.sql

# Documentation de l'API : Swagger UI sur /swagger-ui.html, description OpenAPI sur /v3/api-docs.
# Le jeton saisi dans le bouton Authorize est conservé quand on recharge la page.
springdoc.swagger-ui.persist-authorization=true