spring.application.name=backend
server.port=8080

# Profil actif : dev par défaut, donc rien à configurer sur un poste de développement.
# En production, définir la variable d'environnement SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# Charge le fichier .env (les secrets locaux, jamais versionné) s'il existe. Le chemin est relatif
# au dossier de lancement : les deux emplacements couvrent un lancement depuis backend/ ou depuis
# la racine du dépôt. Une vraie variable d'environnement du système prime toujours sur le .env.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Base de données : seul le mot de passe est obligatoire, le reste a une valeur par défaut locale
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pharmagarde_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.defer-datasource-initialization=true

# Certains services lisent des relations chargées à la demande (quartier, zone) en dehors d'une
# transaction, par exemple ReferentielService. Cela ne fonctionne que si la session de base reste
# ouverte pendant toute la requête web (Open Session In View). Ne pas désactiver ce réglage sans
# avoir d'abord rendu ces lectures transactionnelles.
spring.jpa.open-in-view=true

# Jetons de connexion (JWT) : la clé de signature est un secret, jamais écrite ici
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Origines autorisées à appeler l'API depuis un navigateur (CORS), séparées par des virgules.
# Par défaut : l'application Angular en développement. En production, cette valeur doit être
# donnée explicitement (voir application-prod.properties).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}