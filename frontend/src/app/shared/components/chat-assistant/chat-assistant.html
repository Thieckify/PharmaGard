<div class="assistant-widget">

  @if (ouvert()) {
    <div class="assistant-panel">
      <header class="assistant-panel__header">
        <div class="assistant-panel__titre">
          <span class="assistant-panel__logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M9 3h6a1 1 0 0 1 1 1v4h4a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-4v4a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-4H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h4V4a1 1 0 0 1 1-1z" fill="currentColor" />
            </svg>
          </span>
          <div>
            <span class="assistant-panel__nom">Assistant PharmaGarde</span>
            <span class="assistant-panel__statut">
              <span class="assistant-panel__point"></span>
              En ligne
            </span>
          </div>
        </div>
        <button type="button" class="assistant-panel__fermer" (click)="basculer()" aria-label="Fermer l'assistant">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <div class="assistant-panel__messages" #zoneMessages>
        @for (message of messages(); track message.id) {
          <div class="message" [class.message--utilisateur]="message.role === 'utilisateur'"
            [class.message--erreur]="message.role === 'erreur'">
            {{ message.texte }}
          </div>
        }
        @if (envoiEnCours()) {
          <div class="message message--reflexion">
            <span></span><span></span><span></span>
          </div>
        }
      </div>

      <p class="assistant-panel__avis">
        Ne remplace pas un avis médical. Urgence : <a href="tel:1515">1515</a>
      </p>

      <form class="assistant-panel__saisie" (ngSubmit)="envoyer()">
        <input type="text" [(ngModel)]="question" name="question" placeholder="Posez votre question..."
          [disabled]="envoiEnCours()" maxlength="500" autocomplete="off" />
        <button type="submit" [disabled]="envoiEnCours() || !question.trim()" aria-label="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </form>
    </div>
  }

  <button type="button" class="assistant-bulle" (click)="basculer()"
    [attr.aria-label]="ouvert() ? 'Fermer l\'assistant' : 'Ouvrir l\'assistant'">
    @if (ouvert()) {
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    }
  </button>

</div>
